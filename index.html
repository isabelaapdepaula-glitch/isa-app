<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ED8491"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>ISA</title></head><body><main><section id="home" class="screen active"><header><h1>Olá Isa!</h1><span>🌤️</span></header><button class="create" onclick="openForm()">＋ Criar novo</button><h2>O que vamos fazer agora?</h2><div class="grid"><button onclick="show('habits')">🗓️<b>Hábitos</b></button><button onclick="show('prayers')">🙏<b>Orações</b></button><button onclick="show('agenda')">✅<b>Agenda</b></button></div><div class="card"><h2>Estatísticas de hoje</h2><p id="stats">0% concluído</p></div><div class="pending"><h2>Pendências de hoje</h2><ul id="pending"></ul></div></section><section id="habits" class="screen"><header><h1>Meus hábitos de hoje</h1><span>🌤️</span></header><div id="habitList" class="list"></div><button class="fab" onclick="openForm('habit')">＋</button></section><section id="prayers" class="screen"><header><h1>Minhas orações</h1><span>🌤️</span></header><div id="prayerList" class="list"></div><button class="fab" onclick="openForm('prayer')">＋</button></section><section id="agenda" class="screen"><header><h1>Minha agenda</h1><span>🌤️</span></header><div id="taskList" class="list"></div><button class="fab" onclick="openForm('task')">＋</button></section></main><nav><button onclick="show('home')">🏠</button><button onclick="show('habits')">🗓️</button><button onclick="show('prayers')">🙏</button><button onclick="show('agenda')">✅</button></nav><dialog id="form"><form method="dialog" onsubmit="saveItem(event)"><h2>Novo item</h2><input id="type" type="hidden"><input id="name" placeholder="Nome" required><textarea id="text" placeholder="Texto da oração (opcional)"></textarea><button class="save">Salvar</button><button value="cancel">Cancelar</button></form></dialog><script src="app.js"></script></body></html>
